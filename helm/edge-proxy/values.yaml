image:
  repository: ghcr.io/arkaprabhachowdhury/edge-proxy-go
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

authSecretName: edge-proxy-auth

service:
  type: ClusterIP
  port: 80
  statsPort: 8081

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  mode: http
  proxy:
    port: "8080"
    read_timeout_ms: 15000
    read_header_timeout_ms: 5000
    write_timeout_ms: 30000
    idle_timeout_ms: 60000
    connect_timeout_ms: 3000
    response_header_timeout_ms: 15000
    max_header_bytes: 1048576
    max_body_bytes: 10485760
    max_response_body_bytes: 52428800
  stats:
    port: "8081"
    auth:
      enabled: false
      username: "admin"
      password: "changeme"
  backends:
    - "api-1.default.svc.cluster.local:8080"
    - "api-2.default.svc.cluster.local:8080"
  routes:
    - path: "/api"
      backends:
        - address: "api-1.default.svc.cluster.local:8080"
          weight: 2
        - address: "api-2.default.svc.cluster.local:8080"
          weight: 1
      health_path: "/health"
      timeout_ms: 3000
      retries: 2
  rate_limit:
    enabled: true
    key: ip
    name: "default"
    identifier_header: "X-API-Key"
    base_requests_per_second: 20
    burst_capacity: 40
    block_seconds: 30
    redis:
      addr: "redis.default.svc.cluster.local:6379"
  health_check:
    enabled: true
    interval_seconds: 10
    timeout_seconds: 2
  tracing:
    enabled: false
    service_name: "edge-proxy"
    endpoint: "http://otel-collector.default.svc.cluster.local:4318"
    insecure: true
    sample_ratio: 0.2
