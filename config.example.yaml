# EdgeProxy - Lightweight HTTP Reverse Proxy and Rate Limiter
# Copy this file to config.yaml and edit as needed.
# All values have sensible defaults - only set what you need to change.
# Environment variables override file values.

mode: http # http parses HTTP; tcp blindly forwards bytes to tcp_backend

proxy:
  port: "8080" # env: PORT
  read_timeout_ms: 15000
  read_header_timeout_ms: 5000
  write_timeout_ms: 30000
  idle_timeout_ms: 60000
  connect_timeout_ms: 3000
  response_header_timeout_ms: 15000
  max_header_bytes: 1048576
  max_body_bytes: 10485760
  max_response_body_bytes: 52428800
  tls:
    enabled: false
    cert_file: "cert.pem" # env: TLS_CERT
    key_file: "key.pem" # env: TLS_KEY

stats:
  port: "8081" # env: STATS_PORT
  auth:
    enabled: false
    username: "admin" # env: DASHBOARD_USER
    password: "changeme" # env: DASHBOARD_PASS

routes:
  - path: /api
    backends:
      - address: localhost:9000
        weight: 2
      - address: localhost:9001
        weight: 1
    health_path: /health
    timeout_ms: 3000
    retries: 2

# Used for paths that do not match a route.
backends:
  - localhost:9000
  - localhost:9001
  - localhost:9002

rate_limit:
  enabled: true
  key: ip # ip or a header name such as X-API-Key
  requests: 100
  window_seconds: 60
  base_requests_per_second: 100
  burst_capacity: 100
  sliding_window_seconds: 10
  soft_throttle_milliseconds: 250
  block_seconds: 30
  repeated_abuse_threshold: 3
  event_retention_seconds: 3600
  top_n: 10
  redis: # optional; empty uses a process-local limiter
    addr: "" # env: REDIS_ADDR
    password: "" # env: REDIS_PASSWORD
    db: 0 # env: REDIS_DB

policies:
  - name: "gold-api"
    route_prefix: "/api"
    methods: ["GET", "POST"]
    api_keys: ["gold-key"]
    base_requests_per_second: 50
    burst_capacity: 100
    block_seconds: 10

  - name: "admin-strict"
    route_prefix: "/admin"
    methods: ["GET", "POST", "DELETE"]
    base_requests_per_second: 2
    burst_capacity: 4
    block_seconds: 60

health_check:
  enabled: true
  interval_seconds: 10
  timeout_seconds: 2
  path: /health

tracing:
  enabled: false
  service_name: "edge-proxy"
  endpoint: "http://localhost:4318"
  insecure: true
  sample_ratio: 1
