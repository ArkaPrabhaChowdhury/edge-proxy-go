mode: http
proxy:
  port: ":8080"
  read_timeout_ms: 15000
  read_header_timeout_ms: 5000
  write_timeout_ms: 30000
  idle_timeout_ms: 60000
  connect_timeout_ms: 3000
  response_header_timeout_ms: 3000
  max_header_bytes: 1048576
  max_body_bytes: 10485760
  max_response_body_bytes: 52428800
stats:
  port: ":8081"
backends: []
routes:
  - path: /api
    backends:
      - address: api-1:8000
        weight: 2
      - address: api-2:8000
        weight: 1
      - address: api-3:8000
        weight: 1
    health_path: /health
    timeout_ms: 3000
    retries: 2
rate_limit:
  enabled: true
  requests: 100
  window_seconds: 60
  key: ip
health_check:
  enabled: true
  interval_seconds: 5
  timeout_seconds: 2
  path: /health
