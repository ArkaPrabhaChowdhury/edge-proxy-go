name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Fuzz HTTP parser
        run: go test -run=^$ -fuzz=FuzzHTTPParserDoesNotPanic -fuzztime=10s .
      - name: Run vet
        run: go vet ./...
      - name: Compile benchmark suite
        run: go test -run '^$' -bench '^$' ./...
      - name: Validate default config
        run: go run . validate
